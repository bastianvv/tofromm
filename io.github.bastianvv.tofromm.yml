id: io.github.bastianvv.tofromm
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: tofromm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOPATH: /run/build/tofromm/gopath
    GOCACHE: /run/build/tofromm/.cache/go
    GOPROXY: "off"
    GOFLAGS: "-mod=vendor"

modules:
  - name: tofromm
    buildsystem: simple
    build-commands:
      - go build -v -o /app/bin/tofromm .
      - install -Dm755 packaging/io.github.bastianvv.tofromm.desktop
        /app/share/applications/io.github.bastianvv.tofromm.desktop
      - install -Dm644 packaging/io.github.bastianvv.tofromm.metainfo.xml
        /app/share/metainfo/io.github.bastianvv.tofromm.metainfo.xml
      - install -Dm644 packaging/io.github.bastianvv.tofromm.svg
        /app/share/icons/hicolor/scalable/apps/io.github.bastianvv.tofromm.svg

    sources:
      - type: dir
        path: .
